# From the parent area: adds a child CHILD with avatar AVATAR and returns to the parent area.
appId: in.akhorkhel.app
---
- scrollUntilVisible:
    element:
      id: 'parent-add-child'
    direction: DOWN
- tapOn:
    id: 'parent-add-child'
- extendedWaitUntil:
    visible:
      id: 'profile-nickname'
    timeout: 10000
- tapOn:
    id: 'profile-nickname'
- inputText: '${CHILD}'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'avatar-${AVATAR}'
    direction: DOWN
- tapOn:
    id: 'avatar-${AVATAR}'
- scrollUntilVisible:
    element:
      id: 'profile-save'
    direction: DOWN
- tapOn:
    id: 'profile-save'
- extendedWaitUntil:
    visible:
      id: 'screen-ParentArea'
    timeout: 10000
